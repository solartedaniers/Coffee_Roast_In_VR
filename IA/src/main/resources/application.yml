server:
  # 127.0.0.1 por defecto: solo el backend (en el mismo host) debe llamar a
  # este servicio. En un servidor Linux donde el backend corre en Docker hay
  # que abrirlo a la interfaz que el contenedor alcanza (ver IA/README.md).
  address: ${AI_SERVER_ADDRESS:127.0.0.1}
  port: ${AI_SERVER_PORT:8082}

spring:
  application:
    name: Toasted_VR_AI
  config:
    import: optional:file:./.env[.properties],optional:file:./IA/.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/toasted_vr_db}
    username: ${DB_USERNAME:toasted_vr_user}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${RAG_EMBEDDING_MODEL:nomic-embed-text}
    # Misma tabla y configuración que usaba el backend, para reutilizar el
    # índice ya existente en lugar de recrearlo.
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: rag_document_chunks
        # nomic-embed-text produce vectores de 768 dimensiones.
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

rag:
  query:
    # Development Time Ratio (developmentTimeSeconds / totalDurationSeconds)
    # considerado rango de control operativo óptimo para cafés de altura de
    # Nariño (20% como punto de referencia ideal). Usado solo para describir
    # la desviación en la query de búsqueda de RagContextRetrievalService,
    # no afecta el puntaje ni la fase del tueste.
    dtr-optimal-min: 0.18
    dtr-optimal-max: 0.22
    # Fragmentos de rag-docs/ que se agregan al prompt en cada petición.
    top-k: ${RAG_TOP_K:4}
  # Tamaño y solapamiento (en caracteres) de los fragmentos en que se parte
  # cada PDF al ingestarlo. Cambiarlos no re-ingesta los PDFs ya cargados.
  chunk:
    size-chars: ${RAG_CHUNK_SIZE_CHARS:700}
    overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:100}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_FEEDBACK_MODEL:phi4-mini}
  connect-timeout-millis: ${OLLAMA_CONNECT_TIMEOUT_MILLIS:5000}
  # Phi-4-mini sobre CPU puede tardar hasta ~50s solo en cargar el modelo si
  # Ollama lo había descargado de memoria (ver keep-alive).
  read-timeout-millis: ${OLLAMA_READ_TIMEOUT_MILLIS:120000}
  # Le pide a Ollama que mantenga el modelo cargado en memoria tras cada
  # respuesta, para que la siguiente petición no pague de nuevo el costo de
  # carga (~30-50s en frío).
  keep-alive: ${OLLAMA_KEEP_ALIVE:10m}
  temperature: ${OLLAMA_TEMPERATURE:0.4}
  # Límite de tokens de la respuesta; el texto se recorta a la última frase
  # completa si el modelo se corta a mitad.
  num-predict: ${OLLAMA_NUM_PREDICT:240}
