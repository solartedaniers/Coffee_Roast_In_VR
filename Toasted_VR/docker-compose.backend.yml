services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toasted_vr_db}
      POSTGRES_USER: ${POSTGRES_USER:-toasted_vr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Toasted_VR/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    image: toasted-vr-backend:local
    container_name: toasted_vr_backend
    build:
      context: ./Toasted_VR
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-toasted_vr_db}
      DB_USERNAME: ${POSTGRES_USER:-toasted_vr_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Toasted_VR/.env}
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in Toasted_VR/.env}
      APP_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS:-600}
      APP_JWT_REFRESH_EXPIRATION_HOURS: ${APP_JWT_REFRESH_EXPIRATION_HOURS:-24}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-72}
      USERNAME_MIN_LENGTH: ${USERNAME_MIN_LENGTH:-4}
      USERNAME_MAX_LENGTH: ${USERNAME_MAX_LENGTH:-20}
      UNITY_CODE_HMAC_PEPPER: ${UNITY_CODE_HMAC_PEPPER:?Set UNITY_CODE_HMAC_PEPPER in Toasted_VR/.env}
      UNITY_CODE_ENCRYPTION_KEY: ${UNITY_CODE_ENCRYPTION_KEY:?Set UNITY_CODE_ENCRYPTION_KEY in Toasted_VR/.env}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@toastedvr.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      VERIFICATION_CODE_LENGTH: ${VERIFICATION_CODE_LENGTH:-6}
      VERIFICATION_CODE_EXPIRATION_MINUTES: ${VERIFICATION_CODE_EXPIRATION_MINUTES:-1}
      ONE_TIME_CODE_MAX_ATTEMPTS: ${ONE_TIME_CODE_MAX_ATTEMPTS:-5}
      ONE_TIME_CODE_MAX_RESENDS: ${ONE_TIME_CODE_MAX_RESENDS:-3}
      ONE_TIME_CODE_RESEND_LOCK_MINUTES: ${ONE_TIME_CODE_RESEND_LOCK_MINUTES:-5}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-10}
      EMAIL_KNOWN_PROVIDERS: ${EMAIL_KNOWN_PROVIDERS:-gmail.com,hotmail.com,outlook.com,yahoo.com,icloud.com,hotmail.es,outlook.es,yahoo.es}
      EMAIL_MAX_TYPO_DISTANCE: ${EMAIL_MAX_TYPO_DISTANCE:-1}
      EMAIL_DNS_CHECK_ENABLED: ${EMAIL_DNS_CHECK_ENABLED:-true}
      EMAIL_DNS_TIMEOUT_MILLIS: ${EMAIL_DNS_TIMEOUT_MILLIS:-2000}
      ROAST_HISTORY_PAGE_SIZE: ${ROAST_HISTORY_PAGE_SIZE:-10}
      ROAST_RANKING_SIZE: ${ROAST_RANKING_SIZE:-10}
      ROAST_CHARGE_TEMPERATURE_MIN: ${ROAST_CHARGE_TEMPERATURE_MIN:-0}
      ROAST_CHARGE_TEMPERATURE_MAX: ${ROAST_CHARGE_TEMPERATURE_MAX:-750}
      ROAST_TARGET_TEMPERATURE_MIN: ${ROAST_TARGET_TEMPERATURE_MIN:-150}
      ROAST_TARGET_TEMPERATURE_MAX: ${ROAST_TARGET_TEMPERATURE_MAX:-230}
      ROAST_FINAL_TEMPERATURE_MAX: ${ROAST_FINAL_TEMPERATURE_MAX:-250}
      ROAST_RAW_TEMPERATURE_CEILING: ${ROAST_RAW_TEMPERATURE_CEILING:-186}
      ROAST_BURNED_TEMPERATURE_CEILING: ${ROAST_BURNED_TEMPERATURE_CEILING:-217}
      ROAST_DEFECT_SCORE_MIN: ${ROAST_DEFECT_SCORE_MIN:-5}
      ROAST_DEFECT_SCORE_MAX: ${ROAST_DEFECT_SCORE_MAX:-50}
      ROAST_PERFECT_SCORE_MIN: ${ROAST_PERFECT_SCORE_MIN:-0}
      ROAST_PERFECT_SCORE_MAX: ${ROAST_PERFECT_SCORE_MAX:-100}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "0.0.0.0:8081:8081"
