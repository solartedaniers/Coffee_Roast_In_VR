  server:
    port: ${SERVER_PORT:8081}

  spring:
    application:
      name: Toasted_VR
    config:
      import: optional:file:./.env[.properties],optional:file:./Toasted_VR/.env[.properties]

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/toasted_vr_db}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:}
      driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

    jpa:
      database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
      hibernate:
        ddl-auto: ${JPA_DDL_AUTO:update}
      show-sql: ${JPA_SHOW_SQL:false}
      open-in-view: false
      properties:
        hibernate:
          jdbc:
            "[time_zone]": UTC

    mail:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      properties:
        mail:
          smtp:
            auth: ${MAIL_SMTP_AUTH:true}
            starttls:
              enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

    # Solo el asistente de voz recibe archivos (WAV de hasta 15 s, unos 480 KB). Se lee al
    # entrar al controlador para que un archivo muy grande responda 413 y no un error genérico.
    servlet:
      multipart:
        max-file-size: ${VOICE_UPLOAD_MAX_FILE_SIZE:1MB}
        max-request-size: ${VOICE_UPLOAD_MAX_REQUEST_SIZE:2MB}
        resolve-lazily: true

  app:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # Servicio IA (IA/) al que se delegan la retroalimentación y la ingesta
    # del RAG. El timeout de feedback debe ser mayor que el de Ollama en el
    # servicio IA (120 s), que es quien espera al modelo.
    ai-service:
      base-url: ${AI_SERVICE_BASE_URL:http://localhost:8082}
      connect-timeout-millis: ${AI_SERVICE_CONNECT_TIMEOUT_MILLIS:5000}
      feedback-read-timeout-millis: ${AI_SERVICE_FEEDBACK_READ_TIMEOUT_MILLIS:130000}
      ingestion-read-timeout-millis: ${AI_SERVICE_INGESTION_READ_TIMEOUT_MILLIS:1800000}
      # Pregunta por voz del asistente; debe ser mayor que VOICE_TOTAL_TIMEOUT_MILLIS del servicio IA.
      voice-read-timeout-millis: ${AI_SERVICE_VOICE_READ_TIMEOUT_MILLIS:30000}
    jwt:
      # Sin valor por defecto: la aplicación no arranca si falta APP_JWT_SECRET.
      secret: ${APP_JWT_SECRET}
      expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:600}
      refresh-expiration-hours: ${APP_JWT_REFRESH_EXPIRATION_HOURS:24}
    password-policy:
      min-length: ${PASSWORD_MIN_LENGTH:8}
      max-length: ${PASSWORD_MAX_LENGTH:72}
    username-policy:
      min-length: ${USERNAME_MIN_LENGTH:4}
      max-length: ${USERNAME_MAX_LENGTH:20}
    unity-code:
      hmac-pepper: ${UNITY_CODE_HMAC_PEPPER:}
      encryption-key: ${UNITY_CODE_ENCRYPTION_KEY:}
      expiration-minutes: ${UNITY_ACCESS_CODE_EXPIRATION_MINUTES:10}
    bootstrap-admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      name: ${APP_BOOTSTRAP_ADMIN_NAME:}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    mail:
      enabled: ${MAIL_ENABLED:true}
      from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@toastedvr.local}}
    verification:
      code-length: ${VERIFICATION_CODE_LENGTH:6}
    # Códigos de verificación de correo y de recuperación de contraseña.
    one-time-code:
      expiration-minutes: ${VERIFICATION_CODE_EXPIRATION_MINUTES:1}
      max-attempts: ${ONE_TIME_CODE_MAX_ATTEMPTS:5}
      max-resends: ${ONE_TIME_CODE_MAX_RESENDS:3}
      resend-lock-minutes: ${ONE_TIME_CODE_RESEND_LOCK_MINUTES:5}
    # Dominio del correo al registrarse. known-providers debe coincidir con
    # validation.js del frontend.
    email-domain:
      known-providers: ${EMAIL_KNOWN_PROVIDERS:gmail.com,hotmail.com,outlook.com,yahoo.com,icloud.com,hotmail.es,outlook.es,yahoo.es}
      max-typo-distance: ${EMAIL_MAX_TYPO_DISTANCE:1}
      dns-check-enabled: ${EMAIL_DNS_CHECK_ENABLED:true}
      dns-timeout-millis: ${EMAIL_DNS_TIMEOUT_MILLIS:2000}
    # Permiso para cambiar la contraseña después de verificar el código.
    password-reset:
      token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:10}
    # Historial de sesiones (RF016), tamaño del top del ranking y cada
    # cuántos segundos el cliente consulta si el ranking cambió (RF017).
    roasting:
      history-page-size: ${ROAST_HISTORY_PAGE_SIZE:10}
      ranking-size: ${ROAST_RANKING_SIZE:10}
      ranking-poll-seconds: ${ROAST_RANKING_POLL_SECONDS:60}
    # Validación de sesiones de tueste en el servidor (RF015). Deben coincidir
    # con RoastConstants.js del frontend.
    roast-validation:
      charge-temperature-min: ${ROAST_CHARGE_TEMPERATURE_MIN:0}
      charge-temperature-max: ${ROAST_CHARGE_TEMPERATURE_MAX:750}
      target-temperature-min: ${ROAST_TARGET_TEMPERATURE_MIN:150}
      target-temperature-max: ${ROAST_TARGET_TEMPERATURE_MAX:230}
      final-temperature-max: ${ROAST_FINAL_TEMPERATURE_MAX:250}
      raw-temperature-ceiling: ${ROAST_RAW_TEMPERATURE_CEILING:186}
      burned-temperature-ceiling: ${ROAST_BURNED_TEMPERATURE_CEILING:220}
      defect-score-min: ${ROAST_DEFECT_SCORE_MIN:5}
      defect-score-max: ${ROAST_DEFECT_SCORE_MAX:50}
      perfect-score-min: ${ROAST_PERFECT_SCORE_MIN:0}
      perfect-score-max: ${ROAST_PERFECT_SCORE_MAX:100}
