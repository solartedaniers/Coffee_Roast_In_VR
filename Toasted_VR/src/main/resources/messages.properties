# Textos que ve el usuario o el administrador. Única fuente para los mensajes
# de la API (excepto el módulo de Unity, que mantiene los suyos).

# Errores genéricos
error.validation.invalidRequest=La solicitud no es valida
error.data.integrityViolation=No fue posible guardar la cuenta. Verifica si el correo o el usuario ya existen.
error.unexpected=Ocurrio un error inesperado en el servidor
error.security.unauthorized=No autorizado.
error.security.forbidden=Acceso denegado.

# Registro y verificación
auth.register.codeSent=Te enviamos un codigo de verificacion a tu correo.
auth.register.usernameTaken=El nombre de usuario ya esta en uso.
auth.register.emailTaken=El correo electronico ya esta registrado.
auth.verification.pendingAccountNotFound=No existe una cuenta pendiente para ese correo.
auth.verification.alreadyVerified=Esta cuenta ya fue verificada.
auth.verification.codeExpiredNewSent=El codigo vencio. Te enviamos uno nuevo al correo registrado.
auth.verification.invalidCode=El codigo ingresado no es correcto.
auth.verification.success=La cuenta fue verificada y creada correctamente.

# Inicio de sesión, renovación y cierre
auth.login.invalidCredentials=Las credenciales ingresadas no son validas.
auth.login.emailNotVerified=Debes verificar tu correo antes de iniciar sesion.
auth.login.accountBlocked=La cuenta se encuentra bloqueada.
auth.refresh.invalidToken=El refresh token no es valido.
auth.refresh.expiredToken=El refresh token expiro. Por favor inicia sesion nuevamente.
auth.logout.success=La sesion fue cerrada correctamente.

# Perfil
user.notFound=Usuario no encontrado.
user.profile.usernameTaken=El nombre de usuario ya esta en uso.
user.profile.currentPasswordRequired=Debes ingresar tu contraseña actual.
user.profile.currentPasswordIncorrect=La contraseña actual no es correcta.

# Administración de usuarios
admin.user.found=Usuario encontrado.
admin.user.notFound=Usuario no encontrado.
admin.user.cannotBlockSelf=No puedes bloquear tu propia cuenta.
admin.user.cannotChangeOwnRole=No puedes cambiar tu propio rol.
admin.user.blocked=La cuenta fue bloqueada correctamente.
admin.user.activated=La cuenta fue activada correctamente.
admin.user.roleUpdated=Rol actualizado a {0} correctamente.
admin.user.status.enabledRequired=El campo enabled es obligatorio.
