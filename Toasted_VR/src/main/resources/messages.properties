# Textos que ve el usuario o el administrador. Única fuente para los mensajes
# de la API (excepto el módulo de Unity, que mantiene los suyos).

# Errores genéricos
error.validation.invalidRequest=La solicitud no es válida
error.data.integrityViolation=No fue posible guardar la cuenta. Verifica si el correo o el usuario ya existen.
error.unexpected=Ocurrió un error inesperado en el servidor
error.security.unauthorized=No autorizado.
error.security.forbidden=Acceso denegado.

# Registro y verificación
auth.register.codeSent=Te enviamos un código de verificación a tu correo.
auth.register.usernameTaken=El nombre de usuario ya está en uso.
auth.register.emailTaken=El correo electrónico ya está registrado.
auth.verification.pendingAccountNotFound=No existe una cuenta pendiente para ese correo.
auth.verification.alreadyVerified=Esta cuenta ya fue verificada.
auth.verification.success=La cuenta fue verificada y creada correctamente.

# Códigos de un solo uso (verificación y recuperación)
verification.code.invalid=El código ingresado no es correcto. {0,choice,1#Te queda 1 intento|1<Te quedan {0} intentos}.
verification.code.attemptsExhausted=Agotaste los intentos para este código. Solicita uno nuevo.
verification.code.expired=El código venció. Solicita uno nuevo.
verification.code.stillActive=Tu código actual sigue vigente. Podrás pedir otro cuando venza.
verification.code.tooManyResends=Intenta más tarde.

# Correos
email.delivery.disabled=El envío de correo está desactivado. Activa MAIL_ENABLED y configura SMTP en el archivo .env.
email.delivery.verificationFailed=No fue posible enviar el código de verificación. Revisa la configuración SMTP.
email.verification.subject=Código de verificación - Toasted VR
email.verification.body=Hola {0},\n\nTu código de verificación para Toasted VR es: {1}\n\nEste código vence en {2,choice,1#1 minuto|1<{2} minutos}.\nSi no solicitaste esta cuenta, puedes ignorar este mensaje.\n

# Recuperación de contraseña
auth.passwordReset.requested=Si el correo está registrado, recibirás un código.
auth.passwordReset.invalidCode=El código no es válido o venció. Solicita uno nuevo.
auth.passwordReset.success=Tu contraseña fue actualizada. Inicia sesión con la nueva contraseña.
email.delivery.passwordResetFailed=No fue posible enviar el código de recuperación. Revisa la configuración SMTP.
email.passwordReset.subject=Recuperación de contraseña - Toasted VR
email.passwordReset.body=Hola {0},\n\nTu código para restablecer la contraseña de Toasted VR es: {1}\n\nEste código vence en {2,choice,1#1 minuto|1<{2} minutos}.\nSi no solicitaste este cambio, ignora este mensaje; tu contraseña no cambiará.\n

# Inicio de sesión, renovación y cierre
auth.login.invalidCredentials=Las credenciales ingresadas no son válidas.
auth.login.emailNotVerified=Debes verificar tu correo antes de iniciar sesión.
auth.account.blocked=Fuiste bloqueado por el administrador.
auth.refresh.invalidToken=El refresh token no es válido.
auth.refresh.expiredToken=El refresh token expiró. Por favor inicia sesión nuevamente.
auth.logout.success=La sesión fue cerrada correctamente.
auth.session.revoked=Tu sesión se cerró porque la contraseña cambió. Inicia sesión de nuevo.

# Validaciones compartidas
validation.name.required=El nombre es obligatorio.
validation.email.required=El correo electrónico es obligatorio.
validation.email.invalid=Debes ingresar un correo electrónico válido (por ejemplo, usuario@dominio.com).
validation.username.required=El nombre de usuario es obligatorio.
validation.password.required=La contraseña es obligatoria.
validation.password.confirmationRequired=Debes confirmar la contraseña.
validation.password.mismatch=Las contraseñas no coinciden.
validation.code.required=El código es obligatorio.
validation.code.format=El código debe tener 6 dígitos.
validation.password.policy=La contraseña debe tener entre {0} y {1} caracteres, una mayúscula, una minúscula y un número.
validation.username.length=El usuario debe tener entre {0} y {1} caracteres.

# Perfil
user.notFound=Usuario no encontrado.
user.profile.usernameTaken=El nombre de usuario ya está en uso.
user.profile.currentPasswordRequired=Debes ingresar tu contraseña actual.
user.profile.currentPasswordIncorrect=La contraseña actual no es correcta.

# Administración de usuarios
admin.user.found=Usuario encontrado.
admin.user.notFound=Usuario no encontrado.
admin.user.cannotBlockSelf=No puedes bloquear tu propia cuenta.
admin.user.cannotChangeOwnRole=No puedes cambiar tu propio rol.
admin.user.blocked=La cuenta fue bloqueada correctamente.
admin.user.activated=La cuenta fue activada correctamente.
admin.user.roleUpdated=Rol actualizado a {0} correctamente.
admin.user.status.enabledRequired=El campo enabled es obligatorio.
