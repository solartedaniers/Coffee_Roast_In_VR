services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: toasted_vr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: toasted_vr_db
      POSTGRES_USER: toasted_vr_user
      POSTGRES_PASSWORD: toasted_vr_password
    ports:
      - "5433:5432"
    volumes:
      - toasted_vr_postgres_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d scripts only run when the data directory
      # is first created. On an existing volume from before this change, run
      # the CREATE EXTENSION statement in postgres-init/001-create-vector-extension.sql
      # by hand once instead (e.g. docker exec ... psql ... -f that file).
      - ./postgres-init:/docker-entrypoint-initdb.d

volumes:
  toasted_vr_postgres_data: